name: riskradar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # AI + ENV
  connectivity_plus: 7.1.1
  flutter_riverpod: ^3.3.1

  # UI
  cupertino_icons: 1.0.8
  flutter_svg: 2.2.3
  lottie: 3.3.2
  photo_view: 0.15.0
  flutter_slidable: 4.0.3
  slide_to_act: 2.0.2
  cached_network_image: 3.4.1
  flutter_screenutil: 5.9.3
  fl_chart: 1.2.0
  flutter_map: 8.2.2
  latlong2: 0.9.1
  google_maps_flutter: 2.12.3

  # Authentication + Backend
  supabase_flutter: 2.12.0
  google_sign_in: 7.2.0

  # Deep linking
  app_links: 6.4.1

  # Files + Images
  image_picker: 1.2.1
  permission_handler: 12.0.1
  path: 1.9.1
  path_provider: 2.1.5
  image_cropper: 11.0.0

  # Phone field
  intl_phone_field: 3.2.0
  flutter_phone_direct_caller: 2.2.1

  # Misc
  uuid: 4.5.2
  url_launcher: 6.3.2
  intl: 0.20.2
  rxdart: 0.28.0
  timeago: 3.7.1

  # Location
  geolocator: 14.0.2

  # Notifications
  awesome_notifications: 0.10.1
  flutter_local_notifications: ^17.0.0
  shared_preferences: 2.5.4
  flutter_secure_storage: 10.0.0

  # Audio
  record: 6.2.0
  record_platform_interface: 1.5.0
  audioplayers: 6.5.1
  flutter_sound: 9.30.0
  just_audio: 0.10.5
  audio_waveforms: 2.0.2
  flutter_vibrate:
    path: third_party/flutter_vibrate

  # Database
  sqflite: 2.4.2

  # Firebase
  firebase_core: 4.4.0
  firebase_messaging: 16.1.1

  # Share and downloading
  share_plus: 12.0.2
  pdf: 3.12.0
  printing: 5.14.3
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # ✅ ADDED: App icon generator
  flutter_launcher_icons: 0.14.4

# ✅ ADDED: App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1B3D3D"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/default_user.png
    - assets/google_logo.svg
    - assets/lottie/
    - assets/hazards/
    - assets/audio/sos_alarm.wav
